name: Tests and branch coverage
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pytest with statement and branch coverage
        run: |
          mkdir -p docs/evidence/ci
          python -m pytest tests/ -v --cov=registration --cov-branch --cov-report=term-missing --cov-report=xml:docs/evidence/ci/coverage.xml --junitxml=docs/evidence/ci/junit.xml 2>&1 | tee docs/evidence/ci/pytest.txt
          exit ${PIPESTATUS[0]}
        shell: bash
      - name: Upload test results even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-and-coverage-${{ github.run_id }}
          path: docs/evidence/ci/
